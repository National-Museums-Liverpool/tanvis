<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tanvis New Species Table Example</title>
    <script src="https://unpkg.com/tabulator-tables@6.3.0/dist/js/tabulator.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/tabulator-tables@6.3.0/dist/css/tabulator.min.css" />
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 20px;
      }

      .tanvis {
        margin-top: 1rem;
      }

    </style>
  </head>
  <body>
    <h1>Tanvis New Species Table Example</h1>
   
    <div
      id="vc-control"
      class="tanvis"
      data-vis-type="control-block"
      data-vis-control-elements="area groups language"
      data-vis-area="vc-all"
      xdata-vis-groupid="NHMSYS0000080071"
      data-vis-language="vernacular"
    ></div>

    <div
      id="my-new-species-table"
      class="tanvis"
      data-vis-type="new-species-table"
      data-vis-start-date="year-1"
      data-vis-end-date="year-1"
      data-vis-control="vc-control"
      data-vis-page-size="50"
    ></div>

    <script src="../dist/tanvis.iife.js"></script>
    <script type="module">
      window.Tanvis.init();
    </script>
  </body>
</html>
