<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tanvis Species Absent Since Example</title>
    <script src="https://unpkg.com/tabulator-tables@6.3.0/dist/js/tabulator.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/tabulator-tables@6.3.0/dist/css/tabulator.min.css" />
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 20px;
      }

      .tanvis {
        margin-top: 1rem;
      }
    </style>
  </head>
  <body>
    <h1>Tanvis Species Absent Since Example</h1>
    
    <div
      id="vc-control"
      class="tanvis"
      data-vis-type="control-block"
      data-vis-control-elements="area groups language"
      data-vis-area="vc-all"
      data-vis-groupid="NHMSYS0000080071"
      data-vis-language="vernacular"
    ></div>

    <div
      id="absent-since-table"
      class="tanvis"
      data-vis-type="species-absent-table"
      data-vis-year="2021"
      data-vis-area="vc-59"
      data-vis-control="vc-control"
    ></div>

    <script src="../dist/tanvis.iife.js"></script>
    <script type="module">
      window.Tanvis.init();
    </script>
  </body>
</html>
