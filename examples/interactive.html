<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tanvis Interactive Example</title>
  <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/biologicalrecordscentre/brc-atlas/dist/brcatlas.umd.js"></script>
  <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/gh/biologicalrecordscentre/brc-atlas/dist/brcatlas.umd.css" />
  <script src="https://unpkg.com/tabulator-tables@6.3.0/dist/js/tabulator.min.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/tabulator-tables@6.3.0/dist/css/tabulator.min.css" />
  <script src="https://cdn.jsdelivr.net/gh/biologicalrecordscentre/brc-charts/dist/brccharts.umd.js"></script>
  <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/gh/biologicalrecordscentre/brc-charts/dist/brccharts.umd.css" />
  <script src="../dist/tanvis.iife.js"></script>
  <style>
    /* Reset and layout */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #f3f4f6;
      padding: 20px;
    }

    /* Container for the panels */
    .container {
      display: flex;
      width: 100%;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      overflow: hidden;
      background: #ffffff;
      box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
    }

    /* Panel base styles */
    .panel {
      padding: 20px;
    }

    /* Left panel specific constraints */
    .left-panel {
      /* Initial width */
      width: 300px; 
      min-width: 150px;
      background-color: #f8fafc;
    }

    /* Right panel takes remaining space */
    .right-panel {
      flex: 1;
      min-width: 150px;
      background-color: #ffffff;
    }

    /* Draggable Splitter Bar */
    .splitter {
      width: 8px;
      background-color: #e2e8f0;
      cursor: col-resize;
      transition: background-color 0.2s;
      position: relative;
    }

    /* Highlight bar on hover and during drag */
    .splitter:hover,
    .splitter.dragging {
      background-color: #3b82f6;
    }

    /* Optional visual cue line inside the splitter */
    .splitter::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 2px;
      height: 30px;
      background-color: #94a3b8;
      border-radius: 1px;
    }
    
    .splitter:hover::after,
    .splitter.dragging::after {
      background-color: #ffffff;
    }

    #source {
      width: 100%; 
      height:300px; 
      padding: 8px; 
      margin-top: 10px; 
      border: 1px solid #cbd5e1; 
      border-radius: 4px;
      resize: vertical; 
    }

    #renderButton {
      padding: 8px 16px;
      background-color: lightgrey;
      color: black;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 1.1rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Left Panel -->
    <div class="panel left-panel" id="leftPanel">
      <h3>Enter Tanvis div elements</h3>
      <textarea id="source"></textarea>
      <button id="renderButton" style="margin-top: 10px;" onclick="renderResult()">Render</button>
    </div>

    <!-- Drag Bar -->
    <div class="splitter" id="dragBar"></div>

    <!-- Right Panel -->
    <div class="panel right-panel">
      <h3>Result</h3>
      <div id="result" style="margin-top: 15px;"></div>
    </div>
  </div>

  <script>
    const leftPanel = document.getElementById('leftPanel');
    const dragBar = document.getElementById('dragBar');

    let isDragging = false;

    // Start tracking mouse movements on mouse down
    dragBar.addEventListener('mousedown', function(e) {
      isDragging = true;
      dragBar.classList.add('dragging');
      
      // Prevent text selection while dragging
      document.body.style.userSelect = 'none';
      document.body.style.cursor = 'col-resize';
    });

    // Listen to mouse movements across the entire window
    window.addEventListener('mousemove', function(e) {
      if (!isDragging) return;

      // Calculate new width based on mouse position relative to the left panel
      const containerRect = leftPanel.parentElement.getBoundingClientRect();
      const newWidth = e.clientX - containerRect.left;

      // Apply width directly to the left panel
      leftPanel.style.width = `${newWidth}px`;
    });

    // Stop tracking when mouse is released
    window.addEventListener('mouseup', function() {
      if (isDragging) {
        isDragging = false;
        dragBar.classList.remove('dragging');
        
        // Restore default styles
        document.body.style.userSelect = '';
        document.body.style.cursor = '';
      }
    });

    function renderResult() {
      const sourceContent = document.getElementById('source').value;
      const resultDiv = document.getElementById('result');
      
      // Clear previous content
      resultDiv.innerHTML = '';

      // Create a temporary container to parse the HTML
      const tempContainer = document.createElement('div');
      tempContainer.innerHTML = sourceContent;

      // Append parsed elements to the result div
      while (tempContainer.firstChild) {
        resultDiv.appendChild(tempContainer.firstChild);
      }

      // Initialize Tanvis on the newly added elements
      if (window.Tanvis && typeof window.Tanvis.init === 'function') {
        window.Tanvis.init();
      }
    }
  </script>

</body>
</html>
