<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>API + Tabulator Example</title>
    <script src="https://unpkg.com/tabulator-tables@6.3.0/dist/js/tabulator.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/tabulator-tables@6.3.0/dist/css/tabulator.min.css" />
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 24px;
      }

      #table {
        margin-top: 16px;
      }
    </style>
  </head>
  <body>
    <h1>Tabulator remote pagination example</h1>
    <p>This page fetches the taxon-stats API and shows 10 records per page.</p>

    <div id="table"></div>

    <script>
      const apiUrl = 'https://tanhub.biodiverseit.co.uk/api/v1/taxon-stats?first_record_date%5Bgte%5D=1979-12-31&last_record_date%5Blte%5D=2027-01-01&include=taxon&limit=10&offset=0';

      const table = new Tabulator('#table', {
        layout: 'fitColumns',
        pagination: true,
        paginationMode: 'remote',
        paginationSize: 10,
        placeholder: 'No records found',
        // Hijack the standard AJAX framework using a custom handler callback
        ajaxURL: "custom_handler", 
        ajaxURLGenerator: function(url, config, params) {
            // We bypass Tabulator's automatic URL construction string
            return url; 
        },
        ajaxRequestFunc: async function (url, config, params) {
          const pageNumber = Number(params?.page || 1);
          const pageSize = Number(params?.size || 10);
          const offset = (pageNumber - 1) * pageSize;

          const requestUrl = new URL(apiUrl);
          requestUrl.searchParams.set('limit', String(pageSize));
          requestUrl.searchParams.set('offset', String(offset));

          console.log(`Fetching data from: ${requestUrl.toString()}`);

          const response = await fetch(requestUrl.toString());
          const payload = await response.json();

          console.log('API response payload:', payload);

          if (!response.ok) {
            throw new Error(payload?.error || 'Failed to load data');
          }

          const rows = Array.isArray(payload?.data) ? payload.data : [];
          const totalRows = Number(payload?.meta?.total ?? rows.length ?? 0);
          const lastPage = Math.max(1, Math.ceil(totalRows / pageSize));

          return {
            data: rows.map((row) => ({
              speciesId: row.taxon_identifier,
              scientificName: row?.taxon?.scientific_name || row?.scientific_name || '',
              commonName: row?.taxon?.vernacular_name || row?.vernacular_name || '',
              firstRecordDate: row.first_record_date,
              vcNumber: row.geographic_region_identifier
            })),
            last_page: lastPage,
            last_row: totalRows
          };
        },
        columns: [
          { title: 'Species ID', field: 'speciesId', sorter: 'string' },
          { title: 'Scientific name', field: 'scientificName', sorter: 'string' },
          { title: 'Common name', field: 'commonName', sorter: 'string' },
          { title: 'First record date', field: 'firstRecordDate', sorter: 'string' },
          { title: 'VC number', field: 'vcNumber', sorter: 'number' }
        ]
      });
    </script>
  </body>
</html>
