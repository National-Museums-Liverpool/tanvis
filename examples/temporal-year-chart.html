<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tanvis Temporal Year Chart Example</title>
    <script src="https://d3js.org/d3.v5.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/biologicalrecordscentre/brc-charts/dist/brccharts.umd.js"></script>
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/gh/biologicalrecordscentre/brc-charts/dist/brccharts.umd.css" />
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 20px;
      }

      .tanvis {
        margin-top: 1rem;
      }
    </style>
  </head>
  <body>
    <h1>Tanvis Temporal Year Chart Example</h1>
    
    <div
      id="vc-control"
      class="tanvis"
      data-vis-type="control-block"
      data-vis-area="vc-all"
      data-vis-language="vernacular"
    ></div>

    <div
      class="tanvis"
      data-vis-type="species-name-block"
      data-vis-taxon-id-source="vc-control"
    ></div>

    <div
      class="tanvis"
      data-vis-type="temporal-year-chart"
      data-vis-taxon-id-source="vc-control"
      data-vis-control="vc-control"
      data-vis-start-year="2000"
      data-vis-end-year="2026"
      data-vis-width="600"
      data-vis-expand="false"
      data-vis-temporal-stats-type="switch"
    ></div>

    <script src="../dist/tanvis.iife.js"></script>
    <script type="module">
      window.Tanvis.init();
    </script>
  </body>
</html>
