<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tanvis Species Acount Example</title>
    <script src="/dependencies/leaflet.js"></script>
    <link rel="stylesheet" href="/dependencies/leaflet.css" />
    <script src="/dependencies/d3.v7.min.js"></script>
    <script src="/dependencies/brcatlas.min.umd.js"></script>
    <link rel="stylesheet" type="text/css" href="/dependencies/brcatlas.umd.css" />
    <script src="/dependencies/tabulator.min.js"></script>
    <link rel="stylesheet" href="/dependencies/tabulator.min.css" />
    <script src="/dependencies/brccharts.min.umd.js"></script>
    <link rel="stylesheet" type="text/css" href="/dependencies/brccharts.umd.css" />
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 20px;
      }

      .tanvis {
        margin-top: 1rem;
      }

      .tanvis[data-vis-type="species-info-block"] {
        background-color: #eeeaea;
      }

      /* The parent flex container */
      .flex-container {
        display: flex;
        flex-wrap: wrap;
        width: 100%;
      }

      /* Desktop styles: Size to content */
      .div-1 {
        flex: 0 0 auto; /* Sizes strictly to content */
      }

      /* Desktop styles: Fill remaining space */
      .div-2 {
        flex: 1; /* Grows to fill the rest of the row */
      }

      /* Forces Div 3 to start on a new row */
      .break {
        width: 100%;
        height: 0;
      }

      #species-map-div {
        width: 500px;
      }
      @media (max-width: 500px) {
        #species-map-div {
          width: 100%;
        }
      }

      .charts {
        width: 500px;
        margin-left: 1rem;
      }
      @media (max-width: 500px) {
        .charts {
          width: 100%;
          margin-left: 0;
        }
      }

      /* Responsive break point for mobile screens */
      @media (max-width: 500px) {
        .flex-item {
          width: 100%; /* Forces full width */
          flex: none !important; /* Overrides desktop flex sizing */
        }
        .break {
          display: none; /* Hides the extra break element */
        }
      }
    </style>
  </head>
  <body>
    <h1>Tanvis Species Acount Example</h1>


    <div  
      id="species-identifier"
      class="tanvis"
      data-vis-type="species-identifier"
      data-vis-taxonid="NBNORG0000010518"
    ></div>

    <div  
      class="tanvis"
      data-vis-type="species-name-block"
      data-vis-taxon-id-source="species-identifier"
    ></div>

    <div class="flex-container">
      <div class="flex-item div-1" style="max-width: 500px;">

        <div  
          class="tanvis"
          data-vis-type="species-info-block"
          data-vis-control="vc-control"
          data-vis-taxon-id-source="species-identifier"
        ></div>

        <div  
          class="tanvis"
          data-vis-type="species-remarks-block"
          data-vis-taxon-id-source="species-identifier"
        ></div>
      </div>
      <div class="flex-item div-2" style="margin-left: 2rem">
        <div
          class="tanvis"
          data-vis-type="species-image"
          data-vis-taxon-id-source="species-identifier"
          data-vis-image-variant="none"
          data-vis-width="450"
          data-vis-show-image-caption="true"
          data-vis-show-image-attribution="true"
          data-vis-show-image-license="true"
        ></div>
      </div>
    </div>

    <div
      id="vc-control"
      class="tanvis"
      data-vis-type="control-block"
      data-vis-control-elements="region"
      data-vis-region="vc-all"
    ></div>

    <div class="flex-container">
      <div class="flex-item div-1">
        <div
          id="species-map-div"
          class="tanvis"
          data-vis-type="species-map"
          data-vis-map-type="switch"
          data-vis-control="vc-control"
          data-vis-taxon-id-source="species-identifier"
          data-vis-width="500"
          data-vis-expand="true"
          data-vis-boundaries="true"
          data-vis-dot-colour="cividis"
          data-vis-transformation="deciles"
          data-vis-dot-shape="square"
        ></div>
      </div>
      <div class="flex-item div-2">
        <div
          class="tanvis charts"
          data-vis-type="temporal-year-chart"
          data-vis-taxon-id-source="species-identifier"
          data-vis-control="vc-control"
          data-vis-chart-type="bar"
          data-vis-start-year="2000"
          data-vis-end-year="2026"
          data-vis-width="430"
          data-vis-height="250"
          data-vis-expand="true"
          data-vis-temporal-stats-type="records"
        ></div>
        <div
          class="tanvis charts"
          data-vis-type="temporal-year-chart"
          data-vis-taxon-id-source="species-identifier"
          data-vis-control="vc-control"
          data-vis-chart-type="bar"
          data-vis-start-year="2000"
          data-vis-end-year="2026"
          data-vis-width="430"
          data-vis-height="250"
          data-vis-expand="true"
          data-vis-temporal-stats-type="squares"
        ></div>
      </div>
    </div>

    <script src="../dist/tanvis.iife.js"></script>
    <script type="module">
      window.Tanvis.config = window.Tanvis.config || {};
      window.Tanvis.config.apiBase = 'https://tanhub.biodiverseit.co.uk/api/v1';
      window.Tanvis.init();
    </script>
  </body>
</html>
