<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tanvis Species Map Example</title>
    <script src="../dependencies/leaflet.js"></script>
    <link rel="stylesheet" href="../dependencies/leaflet.css" />
    <script src="../dependencies/d3.v7.min.js"></script>
    <script src="../dependencies/brcatlas.min.umd.js"></script>
    <link rel="stylesheet" type="text/css" href="../dependencies/brcatlas.umd.css" />
    <script src="../dependencies/tabulator.min.js"></script>
    <link rel="stylesheet" href="../dependencies/tabulator.min.css" />
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 20px;
      }

      .tanvis {
        margin-top: 1rem;
      }
    </style>
  </head>
  <body>
    <h1>Tanvis Species Map Example</h1>

    <div
      id="vc-control"
      class="tanvis"
      data-vis-type="control-block"
      data-vis-region="vc-all"
    ></div>

    <div
      class="tanvis"
      data-vis-type="species-name-block"
      data-vis-taxon-id-source="vc-control"
    ></div>

    <div
      class="tanvis"
      id="species-map"
      data-vis-type="species-map"
      data-vis-map-type="switch"
      data-vis-control="vc-control"
      data-vis-taxon-id-source="vc-control"
      data-vis-width="500"
      data-vis-height="500"
      data-vis-expand="false"
      data-vis-hectads="true"
      data-vis-boundaries="true"
      data-vis-dot-colour="viridis"
      data-vis-transformation="deciles"
      data-vis-dot-shape="circle"
    ></div>

    <div
      class="tanvis"
      data-vis-type="records-table"
      data-vis-taxon-id-source="species-map"
      data-vis-page-size="15"
    ></div>

    <script src="../dist/tanvis.iife.js"></script>
    <script type="module">
      window.Tanvis.init();

      // Listen for events from the species map
      const speciesMap = document.getElementById('species-map');
      speciesMap.addEventListener('tetrad-clicked', (event) => {
        console.log('Tetrad clicked:', event.detail);
      });
      speciesMap.addEventListener('taxon-identified', (event) => {
        console.log('Taxon identified:', event.detail);
      });
    </script>
  </body>
</html>
