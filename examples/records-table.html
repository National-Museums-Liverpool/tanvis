<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tanvis Records Table Example</title>
    <script src="../dependencies/tabulator.min.js"></script>
    <link rel="stylesheet" href="../dependencies/tabulator.min.css" />
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 20px;
      }

      .tanvis {
        margin-top: 1rem;
      }
    </style>
  </head>
  <body>
    <h1>Tanvis Records Table Example</h1>

    <div
      id="vc-control"
      class="tanvis"
      data-vis-type="control-block"
      data-vis-region="vc-all"
      data-vis-language="vernacular"
    ></div>

    <div
      class="tanvis"
      data-vis-type="species-name-block"
      data-vis-taxon-id-source="vc-control"
    ></div>

    <div
      class="tanvis"
      data-vis-type="records-table"
      data-vis-control="vc-control"
      data-vis-taxon-id-source="vc-control"
      data-vis-page-size="15"
    ></div>

    <script src="../dist/tanvis.iife.js"></script>
    <script type="module">
      window.Tanvis.config = window.Tanvis.config || {};
      window.Tanvis.config.apiBase = 'https://tanhub.biodiverseit.co.uk/api/v1';
      window.Tanvis.init();
    </script>
  </body>
</html>
