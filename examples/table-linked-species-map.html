<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tanvis Table linked To Species Map Example</title>
    <script src="../dependencies/leaflet.js"></script>
    <link rel="stylesheet" href="../dependencies/leaflet.css" />
    <script src="../dependencies/d3.v7.min.js"></script>
    <script src="../dependencies/brcatlas.min.umd.js"></script>
    <link rel="stylesheet" type="text/css" href="../dependencies/brcatlas.umd.css" />
    <script src="../dependencies/tabulator.min.js"></script>
    <link rel="stylesheet" href="../dependencies/tabulator.min.css" />
    
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 20px;
      }

      .tanvis {
        margin-top: 1rem;
      }
    </style>
  </head>
  <body>
    <h1>Tanvis Table linked To Species Map Example</h1>

    <!-- <div
        id="my-species-table"
        class="tanvis"
        data-vis-type="increasing-species-table"
    ></div> -->

    <!-- <div
        id="my-species-table"
        class="tanvis"
        data-vis-type="new-species-table"
        data-vis-start-date="2025-01-01"
        data-vis-language="vernacular"
    ></div> -->

    <div
      id="my-species-table"
      class="tanvis"
      data-vis-type="species-absent-table"
      data-vis-year="2000"
      data-vis-region="vc-all"
      data-vis-control="vc-control"
    ></div>

    <div
      class="tanvis"
      data-vis-type="species-name-block"
      data-vis-taxon-id-source="my-species-table"
    ></div>

    <div
      class="tanvis"
      data-vis-type="species-map"
      data-vis-map-type="switch"
      data-vis-control="vc-control"
      data-vis-taxon-id-source="my-species-table"
      data-vis-width="500"
      data-vis-height="500"
      data-vis-expand="false"
      data-vis-boundaries="true"
      data-vis-dot-colour="cividis"
      data-vis-transformation="deciles"
      data-vis-dot-shape="square"
    ></div>

    <script src="../dist/tanvis.iife.js"></script>
    <script type="module">
      window.Tanvis.init();
    </script>
  </body>
</html>
