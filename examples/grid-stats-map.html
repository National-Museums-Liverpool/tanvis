<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tanvis Grid Stats Example</title>
    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/biologicalrecordscentre/brc-atlas/dist/brcatlas.umd.js"></script>
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/gh/biologicalrecordscentre/brc-atlas/dist/brcatlas.umd.css" />
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 20px;
      }

      .tanvis {
        margin-top: 1rem;
      }

      pre {
        padding: 1rem;
        background: #f4f4f4;
        border-radius: 6px;
        overflow: auto;
      }
    </style>
  </head>
  <body>
    <h1>Tanvis Grid Stats Example</h1>

    <div
        id="vc-control"
        class="tanvis"
        data-vis-control-elements="area"
        data-vis-show-data-opts-expanded="true"
        data-vis-show-data-opts-toggle="false"
        data-vis-type="control-block"
        data-vis-area="vc-all"
    ></div>

    <!-- 'hectads', 'mapType', 'boundaries',  -->
    <div
      class="tanvis"
      data-vis-type="grid-stats-map"
      data-vis-map-type="switch"
      data-vis-control="vc-control"
      data-vis-grid-stats-type="switch"
      data-vis-dot-colour="viridis"
      data-vis-transformation="log10"
      data-vis-dot-shape="square"
      data-vis-area="vc-60"
      data-vis-width="650"
      data-vis-height="500"
      data-vis-expand="false"
      data-vis-boundaries="false"
      data-vis-hectads="true"
    ></div>

    <script src="../dist/tanvis.iife.js"></script>
    <script type="module">
      //import { installGridStatsMockApi } from './mock/gridStatsMockApi.js';
      //installGridStatsMockApi({ baseUrl: '/api', latencyMs: 150 });
      window.Tanvis.init();
    </script>
  </body>
</html>
